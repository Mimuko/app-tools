# Netlify 2 プロジェクト（CRH / 汎用）— 同一リポジトリ
#
# Publish directory は `.next`（リポジトリルート `.` や `out` だとプラグインが失敗します）
#   Site configuration → Build & deploy → Publish directory → `.next`
#   または UI を空欄にし、本ファイルの publish を優先させる
#
# Environment variables（サイトごと）:
#   TENANT_ID=crh | generic
#   BACKLOG_* （project-observer）

[build]
  # UI の Build command より netlify.toml が優先される。CRH のみ sync は build:netlify 内で TENANT_ID 判定
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.18.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 旧 URL（refactor/repo-cleanup 由来）。Next ランタイムでも netlify.toml で有効。
[[redirects]]
  from = "/tools/judgment"
  to = "/tools/request/"
  status = 301
  force = true

[[redirects]]
  from = "/tools/judgment/*"
  to = "/tools/request/:splat"
  status = 301
  force = true

# 注意: `/*` → `/index.html` の SPA フォールバックは Next.js と競合するため入れない
